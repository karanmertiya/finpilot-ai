version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finpilot-postgres
    restart: always
    environment:
      POSTGRES_USER: finpilot
      POSTGRES_PASSWORD: finpilot_password
      POSTGRES_DB: finpilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpilot -d finpilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finpilot-backend
    restart: always
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://finpilot:finpilot_password@postgres:5432/finpilot_db
      - CORS_ORIGINS=["*"]

      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_PROVIDER=local
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finpilot-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://4.240.114.82:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
